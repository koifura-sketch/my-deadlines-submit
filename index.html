<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提出物・予定管理アプリ (自動同期版)</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --input-bg: #2d2d2d;
            --text-color: #e0e0e0;
            --text-muted: #aaaaaa;
            --border-color: #3d3d3d;
            --primary-button: #2196f3;
            --success-color: #4caf50;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container { width: 100%; max-width: 800px; }
        h1, h2, h3 { text-align: center; color: #ffffff; }

        .tabs { display: flex; justify-content: center; margin-bottom: 20px; gap: 10px; flex-wrap: wrap; }
        .tab-btn {
            background-color: var(--card-bg); color: var(--text-color);
            border: 1px solid var(--border-color); padding: 10px 20px;
            border-radius: 20px; cursor: pointer; font-weight: bold;
        }
        .tab-btn.active { background-color: var(--primary-button); color: #fff; border-color: var(--primary-button); }

        .page { display: none; }
        .page.active { display: block; }

        .form-flex { display: flex; flex-direction: column; gap: 20px; }
        .form-card { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); }
        .form-card h3 { margin-top: 0; text-align: left; border-bottom: 2px solid var(--border-color); padding-bottom: 8px; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px; background-color: var(--input-bg);
            border: 1px solid var(--border-color); border-radius: 6px;
            color: var(--text-color); box-sizing: border-box; font-size: 16px;
        }
        .date-row { display: flex; gap: 10px; }
        button.submit-btn { width: 100%; padding: 14px; background-color: var(--primary-button); color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button.submit-btn.plan-btn { background-color: #9c27b0; }

        .task-list { list-style: none; padding: 0; margin: 0 0 30px 0; }
        .task-item {
            background: var(--card-bg); padding: 15px; border-radius: 8px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center; border-left: 8px solid #fff;
            border-top: 1px solid var(--border-color); border-right: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color);
        }
        .task-name { font-weight: bold; font-size: 18px; }
        .task-details { font-size: 14px; margin-top: 4px; }

        .subject-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-right: 8px; color: #fff; }
        .subject-badge.bg-white { color: #000; }
        .plan-badge { background-color: #9c27b0; color: #fff; }

        .days-left { font-weight: bold; }
        .days-1 { color: #ff4d4d; }
        .days-2 { color: #ffa500; }
        .days-3 { color: #ffff00; }
        .days-4 { color: #9acc32; }
        .days-5 { color: #adff2f; }
        .days-10 { color: #00ff00; }

        .complete-btn { background-color: #444; color: var(--text-color); border: 1px solid var(--border-color); border-radius: 4px; padding: 8px 16px; cursor: pointer; font-weight: bold; }
        .complete-btn:hover { background-color: var(--success-color); }

        .calendar-container { background: var(--card-bg); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 30px; }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 10fr); gap: 5px; text-align: center; }
        .calendar-day-head { font-weight: bold; padding: 5px; color: var(--text-muted); }
        .calendar-cell { background: var(--input-bg); min-height: 75px; border-radius: 4px; padding: 4px; font-size: 12px; display: flex; flex-direction: column; align-items: flex-start; overflow: hidden; }
        .calendar-cell .day-num { font-weight: bold; margin-bottom: 3px; }
        .calendar-cell.today { border: 2px solid var(--primary-button); }
        
        .cal-item-dot { width: 92%; font-size: 10px; padding: 1px 3px; border-radius: 2px; margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #fff; text-align: left; }
        .cal-item-dot.bg-white { color: #000; }

        .archive-container { background: #1a1a1a; padding: 20px; border-radius: 12px; border: 1px solid #2a2a2a; margin-top: 20px; }
        .archive-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 15px; }
        .archive-select { padding: 8px; background: var(--input-bg); color: var(--text-color); border: 1px solid var(--border-color); border-radius: 6px; font-size: 14px; }
        
        .history-item { opacity: 0.6; border-left: 8px solid #555 !important; }
        .history-date { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

        .empty-message { text-align: center; color: var(--text-muted); padding: 20px; }
    </style>

    <!-- Firebaseシステム -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC_7gj8hpablW97fm0sNJtaG6HUb3SQ1r8",
            authDomain: "my-deadline-in-school-app.firebaseapp.com",
            databaseURL: "https://my-deadline-in-school-app-default-rtdb.firebaseio.com/",
            projectId: "my-deadline-in-school-app",
            storageBucket: "my-deadline-in-school-app.firebasestorage.app",
            messagingSenderId: "574584419324",
            appId: "1:574584419324:web:29f6d30895978ec9aaf879"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const currentUsername = "my_shared_school_data_room";
        let globalTasks = [];
        let globalPlans = [];
        let globalHistory = [];
        let currentCalendarDate = new Date();

        const subjects = {
            '数学Ⅰ': { color: '#0055ff', class: '' }, '数学A': { color: '#000080', class: '' },
            '言語文化': { color: '#ff0000', class: '' }, '現代の国語': { color: '#ff8888', class: '' },
            '英語コミュニケーション': { color: '#ffa500', class: '' }, '英語論理表現': { color: '#ff4500', class: '' },
            '地理': { color: '#90ee90', class: '' }, '科学': { color: '#800080', class: '' },
            '歴史': { color: '#8b4513', class: '' }, '生物': { color: '#008000', class: '' },
            '物理': { color: '#808080', class: '' }, 'その他': { color: '#ffffff', class: 'bg-white' }
        };

        document.addEventListener('DOMContentLoaded', () => {
            initSubjectSelect();
            loadYearPreference();
            setDefaultMonthDay();
            initArchiveMonthSelect();
            
            // 提出物データの同期
            onValue(ref(db, 'tasks/' + currentUsername), (snapshot) => {
                globalTasks = [];
                const data = snapshot.val();
                if (data) {
                    Object.keys(data).forEach(key => {
                        let item = data[key]; item.databaseId = key; globalTasks.push(item);
                    });
                }
                renderTasks(); renderCalendar();
            });

            // 予定表データの同期
            onValue(ref(db, 'plans/' + currentUsername), (snapshot) => {
                globalPlans = [];
                const data = snapshot.val();
                if (data) {
                    Object.keys(data).forEach(key => {
                        let item = data[key]; item.databaseId = key; globalPlans.push(item);
                    });
                }
                renderPlans(); renderCalendar();
            });

            // 完了済み履歴データの同期
            onValue(ref(db, 'history/' + currentUsername), (snapshot) => {
                globalHistory = [];
                const data = snapshot.val();
                if (data) {
                    Object.keys(data).forEach(key => {
                        let item = data[key]; item.databaseId = key; globalHistory.push(item);
                    });
                }
                renderHistory();
            });
        });

        function initSubjectSelect() {
            const select = document.getElementById('taskSubject');
            select.innerHTML = "";
            for (let sub in subjects) {
                let opt = document.createElement('option'); opt.value = sub; opt.textContent = sub; select.appendChild(opt);
            }
        }

        function initArchiveMonthSelect() {
            const select = document.getElementById('archiveMonthFilter');
            select.innerHTML = '';
            // 直近の過去1年分を選択肢にする
            const now = new Date();
            for(let i=0; i<12; i++) {
                const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                const val = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
                const txt = `${d.getFullYear()}年 ${d.getMonth()+1}月`;
                let opt = document.createElement('option'); opt.value = val; opt.textContent = txt;
                select.appendChild(opt);
            }
            select.addEventListener('change', renderHistory);
        }

        window.saveYearPreference = function() {
            localStorage.setItem('preferredYear', document.getElementById('yearSelect').value);
            localStorage.setItem('preferredPlanYear', document.getElementById('planYearSelect').value);
        };
        function loadYearPreference() {
            const savedYear = localStorage.getItem('preferredYear');
            if (savedYear) document.getElementById('yearSelect').value = savedYear;
            const savedPlanYear = localStorage.getItem('preferredPlanYear');
            if (savedPlanYear) document.getElementById('planYearSelect').value = savedPlanYear;
        }
        function setDefaultMonthDay() {
            const today = new Date();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            const dateStr = `${today.getFullYear()}-${month}-${day}`;
            document.getElementById('taskMonthDay').value = dateStr;
            document.getElementById('planMonthDay').value = dateStr;
        }

        // 提出物の追加
        window.addTask = function() {
            const name = document.getElementById('taskName').value;
            const subject = document.getElementById('taskSubject').value;
            const year = document.getElementById('yearSelect').value;
            const monthDay = document.getElementById('taskMonthDay').value;
            if (!name || !monthDay) { alert('入力してください！'); return; }
            const finalDeadline = `${year}-${monthDay.split('-')[1]}-${monthDay.split('-')[2]}`;
            
            push(ref(db, 'tasks/' + currentUsername), {
                name: name, subject: subject, deadline: finalDeadline, createdAt: Date.now()
            });
            document.getElementById('taskName').value = '';
            switchPage('page2');
        };

        // 予定の追加
        window.addPlan = function() {
            const name = document.getElementById('planName').value;
            const year = document.getElementById('planYearSelect').value;
            const monthDay = document.getElementById('planMonthDay').value;
            if (!name || !monthDay) { alert('入力してください！'); return; }
            const finalDeadline = `${year}-${monthDay.split('-')[1]}-${monthDay.split('-')[2]}`;
            
            push(ref(db, 'plans/' + currentUsername), {
                name: name, deadline: finalDeadline, createdAt: Date.now()
            });
            document.getElementById('planName').value = '';
            switchPage('page3');
        };

        // タスクを完了にして履歴に移動
        window.completeTask = function(databaseId, name, subject, deadline) {
            if (confirm('完了にしますか？（完了済みリストに移動します）')) {
                const now = new Date();
                const completedMonth = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
                
                // 履歴にプッシュ
                push(ref(db, 'history/' + currentUsername), {
                    name: name, subject: subject, deadline: deadline, completedAt: Date.now(), completedMonth: completedMonth
                });
                // 元データを消去
                remove(ref(db, 'tasks/' + currentUsername + '/' + databaseId));
            }
        };

        function getDaysLeftClassAndText(deadlineStr) {
            const today = new Date(); today.setHours(0,0,0,0);
            const deadline = new Date(deadlineStr); deadline.setHours(0,0,0,0);
            const diffDays = Math.ceil((deadline - today) / (1000 * 60 * 60 * 24));
            if (diffDays < 0) return { class: 'days-1', text: `期限超過` };
            if (diffDays === 0) return { class: 'days-1', text: '今日！' };
            if (diffDays === 1) return { class: 'days-1', text: '残り1日' };
            if (diffDays === 2) return { class: 'days-2', text: '残り2日' };
            if (diffDays === 3) return { class: 'days-3', text: '残り3日' };
            if (diffDays === 4) return { class: 'days-4', text: '残り4日' };
            if (diffDays >= 5 && diffDays < 10) return { class: 'days-5', text: `残り${diffDays}日` };
            return { class: 'days-10', text: `残り${diffDays}日` };
        }

        // 提出物一覧の描画
        function renderTasks() {
            const taskList = document.getElementById('taskList');
            const emptyMessage = document.getElementById('emptyMessage');
            taskList.innerHTML = '';
            if (globalTasks.length === 0) { emptyMessage.style.display = 'block'; return; }
            emptyMessage.style.display = 'none';

            globalTasks.sort((a, b) => new Date(a.deadline) - new Date(b.deadline));
            globalTasks.forEach(task => {
                const li = document.createElement('li'); li.className = 'task-item';
                const subInfo = subjects[task.subject] || { color: '#fff', class: '' };
                li.style.borderLeftColor = subInfo.color;
                const daysInfo = getDaysLeftClassAndText(task.deadline);
                li.innerHTML = `
                    <div>
                        <div class="task-name">${escapeHTML(task.name)}</div>
                        <div class="task-details">
                            <span class="subject-badge ${subInfo.class}" style="background-color: ${subInfo.color}">${task.subject}</span>
                            <span>締切: ${task.deadline} </span>
                            <span class="days-left ${daysInfo.class}">(${daysInfo.text})</span>
                        </div>
                    </div>
                    <button class="complete-btn" onclick="completeTask('${task.databaseId}', '${escapeHTML(task.name)}', '${task.subject}', '${task.deadline}')">完了</button>
                `;
                taskList.appendChild(li);
            });
        }

        // 予定表一覧の描画
        function renderPlans() {
            const planList = document.getElementById('planList');
            const emptyPlanMessage = document.getElementById('emptyPlanMessage');
            planList.innerHTML = '';
            if (globalPlans.length === 0) { emptyPlanMessage.style.display = 'block'; return; }
            emptyPlanMessage.style.display = 'none';

            globalPlans.sort((a, b) => new Date(a.deadline) - new Date(b.deadline));
            globalPlans.forEach(plan => {
                const li = document.createElement('li'); li.className = 'task-item';
                li.style.borderLeftColor = '#9c27b0';
                const daysInfo = getDaysLeftClassAndText(plan.deadline);
                li.innerHTML = `
                    <div>
                        <div class="task-name">${escapeHTML(plan.name)}</div>
                        <div class="task-details">
                            <span class="subject-badge plan-badge">予定・テスト</span>
                            <span>日程: ${plan.deadline} </span>
                            <span class="days-left ${daysInfo.class}">(${daysInfo.text})</span>
                        </div>
                    </div>
                `;
                planList.appendChild(li);
            });
        }

        // 完了済み履歴の描画（月別）
        function renderHistory() {
            const historyList = document.getElementById('historyList');
            const emptyHistoryMessage = document.getElementById('emptyHistoryMessage');
            const selectedMonth = document.getElementById('archiveMonthFilter').value;
            historyList.innerHTML = '';

            const filtered = globalHistory.filter(h => h.completedMonth === selectedMonth);
            if (filtered.length === 0) { emptyHistoryMessage.style.display = 'block'; return; }
            emptyHistoryMessage.style.display = 'none';

            filtered.sort((a, b) => b.completedAt - a.completedAt);
            filtered.forEach(h => {
                const li = document.createElement('li'); li.className = 'task-item history-item';
                const compDate = new Date(h.completedAt).toLocaleDateString('ja-JP');
                li.innerHTML = `
                    <div>
                        <div class="task-name" style="text-decoration: line-through; color: var(--text-muted);">${escapeHTML(h.name)}</div>
                        <div class="task-details">
                            <span class="subject-badge" style="background-color: #555;">${h.subject}</span>
                            <span>当初締切: ${h.deadline}</span>
                            <div class="history-date">🗹 ${compDate} に完了</div>
                        </div>
                    </div>
                `;
                historyList.appendChild(li);
            });
        }

        // カレンダー描画（提出物と予定の両方を表示）
        window.renderCalendar = function() {
            const grid = document.getElementById('calendarGrid');
            const title = document.getElementById('calendarTitle');
            if(!grid || !title) return;
            grid.innerHTML = '';
            
            const year = currentCalendarDate.getFullYear();
            const month = currentCalendarDate.getMonth();
            title.textContent = `${year}年 ${month + 1}月`;

            ['日', '月', '火', '水', '木', '金', '土'].forEach(d => {
                const div = document.createElement('div'); div.className = 'calendar-day-head'; div.textContent = d; grid.appendChild(div);
            });

            const firstDayIdx = new Date(year, month, 1).getDay();
            const numDays = new Date(year, month + 1, 0).getDate();
            for (let i = 0; i < firstDayIdx; i++) grid.appendChild(document.createElement('div'));

            for (let day = 1; day <= numDays; day++) {
                const cell = document.createElement('div'); cell.className = 'calendar-cell';
                if (new Date().getFullYear() === year && new Date().getMonth() === month && new Date().getDate() === day) cell.classList.add('today');
                
                const dayNumSpan = document.createElement('span'); dayNumSpan.className = 'day-num'; dayNumSpan.textContent = day; cell.appendChild(dayNumSpan);
                const thisDateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;

                // 提出物を表示
                globalTasks.filter(t => t.deadline === thisDateStr).forEach(t => {
                    const subInfo = subjects[t.subject] || { color: '#fff', class: '' };
                    const dot = document.createElement('div'); dot.className = `cal-item-dot ${subInfo.class}`; dot.style.backgroundColor = subInfo.color; dot.textContent = `📝${t.name}`; cell.appendChild(dot);
                });

                // 予定を表示
                globalPlans.filter(p => p.deadline === thisDateStr).forEach(p => {
                    const dot = document.createElement('div'); dot.className = 'cal-item-dot'; dot.style.backgroundColor = '#9c27b0'; dot.textContent = `📅${p.name}`; cell.appendChild(dot);
                });
                
                grid.appendChild(cell);
            }
        };

        window.changeMonth = function(offset) { currentCalendarDate.setMonth(currentCalendarDate.getMonth() + offset); renderCalendar(); };
        window.switchPage = function(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tabs .tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            
            let btnIdx = 0;
            if(pageId === 'page2') btnIdx = 1;
            if(pageId === 'page3') btnIdx = 2;
            document.querySelectorAll('.tabs .tab-btn')[btnIdx].classList.add('active');
            
            if(pageId === 'page2' || pageId === 'page3') { renderCalendar(); renderTasks(); renderPlans(); renderHistory(); }
        };
        function escapeHTML(str) { return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)); }
    </script>
</head>
<body>
<div class="container">
    <h1>📅 提出物・予定管理システム</h1>
    <div class="tabs">
        <button class="tab-btn active" onclick="switchPage('page1')">1. 登録画面</button>
        <button class="tab-btn" onclick="switchPage('page2')">2. 提出物一覧・カレンダー</button>
        <button class="tab-btn" onclick="switchPage('page3')">3. 予定表・テスト一覧</button>
    </div>

    <!-- ページ1: 登録 -->
    <div id="page1" class="page active">
        <div class="form-flex">
            <!-- 提出物登録ボックス -->
            <div class="form-card">
                <h3>📝 提出物の登録</h3>
                <div class="form-group">
                    <label for="taskName">提出物の名前</label>
                    <input type="text" id="taskName" placeholder="例：数学プリント、国語レポート">
                </div>
                <div class="form-group">
                    <label for="taskSubject">科目・ジャンル</label>
                    <select id="taskSubject"></select>
                </div>
                <div class="form-group">
                    <label>締め切り日</label>
                    <div class="date-row">
                        <select id="yearSelect" onchange="saveYearPreference()">
                            <option value="2026">2026年</option> <option value="2027">2027年</option>
                            <option value="2028">2028年</option> <option value="2029">2029年</option>
                        </select>
                        <input type="date" id="taskMonthDay">
                    </div>
                </div>
                <button class="submit-btn" onclick="addTask()">締め切りを追加する</button>
            </div>

            <!-- 予定表登録ボックス -->
            <div class="form-card" style="border-color: #9c27b0;">
                <h3 style="color: #e040fb; border-color: #9c27b0;">📅 予定・テストの登録</h3>
                <div class="form-group">
                    <label for="planName">予定・テストの名前</label>
                    <input type="text" id="planName" placeholder="例：中間テスト、漢字検定、三者面談">
                </div>
                <div class="form-group">
                    <label>予定日</label>
                    <div class="date-row">
                        <select id="planYearSelect" onchange="saveYearPreference()">
                            <option value="2026">2026年</option> <option value="2027">2027年</option>
                            <option value="2028">2028年</option> <option value="2029">2029年</option>
                        </select>
                        <input type="date" id="planMonthDay">
                    </div>
                </div>
                <button class="submit-btn plan-btn" onclick="addPlan()">予定を追加する</button>
            </div>
        </div>
    </div>

    <!-- ページ2: 提出物カレンダー -->
    <div id="page2" class="page">
        <h2>📋 提出物締め切り一覧（日付順）</h2>
        <ul id="taskList" class="task-list"></ul>
        <div id="emptyMessage" class="empty-message">登録された締め切りはありません。</div>
        
        <h2>📅 共通カレンダー</h2>
        <div class="calendar-container">
            <div class="calendar-header">
                <button class="tab-btn" onclick="changeMonth(-1)">◀ 前の月</button>
                <h3 id="calendarTitle"></h3>
                <button class="tab-btn" onclick="changeMonth(1)">次の月 ▶</button>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>

        <!-- 完了済みタスクエリア -->
        <div class="archive-container">
            <div class="archive-header">
                <h3 style="margin: 0; color: var(--success-color);">✅ 完了済みのタスク</h3>
                <select id="archiveMonthFilter" class="archive-select"></select>
            </div>
            <ul id="historyList" class="task-list" style="margin-bottom: 0;"></ul>
            <div id="emptyHistoryMessage" class="empty-message" style="padding: 10px;">この月に完了したタスクはありません。</div>
        </div>
    </div>
